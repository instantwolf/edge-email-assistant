# Email & Calendar Assistant - agentic AI stack (edge and cloud use the same file)

services:
  n8n:
    image: n8nio/n8n:2.28.6
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY}
      - GENERIC_TIMEZONE=${TZ:-Europe/Vienna}
      - TZ=${TZ:-Europe/Vienna}
      - WEBHOOK_URL=${N8N_PUBLIC_URL:-http://localhost:5678}
      - N8N_DIAGNOSTICS_ENABLED=false
      # Test Google account the workflow's calendar nodes target (see .env.example).
      - GOOGLE_ACCOUNT_EMAIL=${GOOGLE_ACCOUNT_EMAIL}
    volumes:
      - n8n_data:/home/node/.n8n
    extra_hosts:
      # lets host.docker.internal resolve on Linux VMs too (Ollama runs natively on the host)
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy

  # Ollama runs natively on the host (not containerized) for GPU access -
  # macOS Metal, Windows/Linux CUDA. n8n reaches it via the credential URL
  # http://host.docker.internal:11434. On a GCP Linux VM, install Ollama
  # natively too and keep the same credential URL.

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  n8n_data:
  pg_data:
